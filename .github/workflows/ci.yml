name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit evaluations suite
        run: |
          python evals/test_all_scenarios.py

      - name: Start Docker Compose environment
        run: |
          docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          timeout 60s bash -c '
          until curl -s -f http://localhost:8000/health > /dev/null; do
            echo "Waiting for Dispute Desk service at :8000..."
            sleep 2
          done'
          echo "Dispute Desk service is healthy!"

      - name: Run end-to-end evaluations against running service
        run: |
          python evals/run.py http://localhost:8000 http://localhost:8081

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose logs

